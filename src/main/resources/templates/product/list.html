<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title>Product List</title>
</head>
<body>
<section layout:fragment="content">
    <h1>Product List</h1>
    <div class="mb-3">
        <a th:if="${isAdminOrManager}" th:href="@{/product/add}" class="btn btn-primary">Add Product</a>
    </div>

    <form th:action="@{/product/search}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control" placeholder="Search by product name">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Description</th>
            <th>Image</th>
            <th>Quantity</th>
            <th>Category</th>
            <th th:if="${isAdminOrManager}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.description}"></td>
            <td>
                <img th:if="${product.image != null}" th:src="@{/product/images/{filename}(filename=${product.image})}" alt="Product Image" width="100"/>
            </td>
            <td th:text="${product.quantity}"></td>
            <td th:text="${product.category.name}"></td>
            <td th:if="${isAdminOrManager}">
                <a th:href="@{/product/edit/{id}(id=${product.id})}" class="btn btn-success btn-sm">Edit</a>
                <a th:href="@{/product/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
