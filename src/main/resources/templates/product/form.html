<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
    <title th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Product Form</title>
</head>
<body>
<section layout:fragment="content">
    <h1 th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Product Form</h1>

    <form th:action="@{${product.id == null} ? '/product/add' : '/product/edit/' + ${product.id}}" th:object="${product}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" id="name">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price">
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" id="description"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        
        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control" id="quantity">
            <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select th:field="*{category}" class="form-control" id="category">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Image</label>
            <input type="file" name="imageFile" class="form-control" id="imageFile">
            <img th:if="${product.image != null}" th:src="@{/product/images/{filename}(filename=${product.image})}" alt="Current Image" width="150" class="mt-2"/>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/product}" class="btn btn-secondary">Cancel</a>
    </form>
</section>
</body>
</html>
